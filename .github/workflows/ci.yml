name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # the resume corpus, BIPIA and Tensor Trust are downloaded once, pinned and hash-checked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/doorman
          key: doorman-data-${{ hashFiles('doorman/data.py') }}
      - run: pip install -e '.[dev]'
      # The change on this branch is one the unit tests exist to catch: this step passes only when
      # exactly these tests fail, and fails if they pass or if anything else breaks.
      - name: Unit tests (must catch this change)
        shell: bash
        run: |
          set +e
          pytest -q -rf 2>&1 | tee tests.log
          set -e
          expected=$(sort <<'LIST'
            tests/test_doorman.py::test_allowlist_confines_the_agent_to_the_applicant_it_is_screening
            tests/test_doorman.py::test_llm_adapter_runs_tool_calls_through_the_same_checks
          LIST
          )
          expected=$(sed 's/^ *//' <<< "$expected" | sort)
          got=$(grep -oE '^FAILED [^ ]+' tests.log | cut -d' ' -f2 | sort)
          if [ "$got" != "$expected" ]; then echo "::error::expected exactly the guarding tests to fail, got: $got"; exit 1; fi
          echo "::notice::The unit tests caught this change."
      # This branch is a demonstration: it carries a weaker tool allowlist, which the gate exists to refuse. The job
      # passes only when the gate fails it for that reason, and fails if the gate lets it through.
      - name: Gate (must refuse this change)
        shell: bash
        run: |
          set +e
          python -m doorman gate 2>&1 | tee gate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then echo "::error::the gate let this change through"; exit 1; fi
          grep -qF -- 'GATE: ' gate.log || { echo "::error::the gate failed for another reason"; exit 1; }
          echo "::notice::The gate refused this change, as it should."
