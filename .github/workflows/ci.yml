name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # the resume corpus, BIPIA and Tensor Trust are downloaded once, pinned and hash-checked
      - uses: actions/cache@v4
        with:
          path: ~/.cache/doorman
          key: doorman-data-${{ hashFiles('doorman/data.py') }}
      - run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Defence gate (fails if any layer lets more attacks through than the baseline)
        run: python -m doorman gate
